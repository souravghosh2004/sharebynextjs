<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        #document-container {
            background: white;
            width: 100%;
            max-width: 800px; /* A4 width approx */
            padding: 50px;
            margin: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }
        /* Loader Styles */
        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3;
            border-top: 4px solid #333; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Print Styles - Hides UI, shows doc */
        @media print {
            body { background: white; }
            #document-container { 
                margin: 0; padding: 0; box-shadow: none; max-width: none; 
            }
            .loading-overlay { display: none; }
            @page { margin: 2cm; }
        }
    </style>
</head>
<body>

    <div id="loader" class="loading-overlay">
        <div class="spinner"></div>
        <p id="status">Loading document...</p>
    </div>

    <div id="document-container"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const fileUrl = params.get('url');
        const container = document.getElementById('document-container');
        const loader = document.getElementById('loader');
        const status = document.getElementById('status');

        if (!fileUrl) {
            status.innerText = "Error: No file URL provided.";
            status.style.color = "red";
        } else {
            // 1. Fetch the file
            fetch(fileUrl)
                .then(response => {
                    if (!response.ok) throw new Error("Failed to fetch file");
                    return response.arrayBuffer();
                })
                .then(arrayBuffer => {
                    status.innerText = "Converting for print...";
                    // 2. Convert DOCX to HTML using Mammoth
                    return mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
                })
                .then(result => {
                    // 3. Display the HTML
                    container.innerHTML = result.value;
                    loader.style.display = "none";
                    
                    // 4. Trigger Print Dialog
                    setTimeout(() => {
                        document.title = "Document Print";
                        window.print();
                    }, 500);
                })
                .catch(error => {
                    console.error(error);
                    status.innerText = "Error processing document.";
                    status.style.color = "red";
                });
        }
    </script>
</body>
</html>
